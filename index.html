<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHOE CRAFT | Premium Footwear & Sneakers</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="logo">
      <h1>SHOE<span>CRAFT</span></h1>
    </div>
    <div class="header-status">
      <span class="badge">Authentic Footwear</span>
    </div>
  </header>

  <main class="main-container">

    <section class="catalog-section">
      <div class="filter-bar">
        <input 
          type="text" 
          class="search-input" 
          placeholder="Search shoes or brands..." 
        />
        <select class="category-select">
          <option value="all">All Brands</option>
          <option value="nike">Nike</option>
          <option value="adidas">Adidas</option>
          <option value="newbalance">New Balance</option>
          <option value="puma">Puma</option>
          <option value="skechers">Skechers</option>
          <option value="converse">Converse</option>
          <option value="asics">Asics</option>
          <option value="reebok">Reebok</option>
          <option value="crocs">Crocs</option>
          <option value="worldbalance">World Balance</option>
        </select>
      </div>

      <div class="product-grid"></div>
    </section>

    <aside class="sidebar-section">
      
      <div class="card-box">
        <h2>Shopping Cart</h2>
        <div class="cart-container"></div>
      </div>

      <div class="card-box margin-top">
        <h2>Customer Checkout</h2>
        <div class="checkout-form-container">
          <form id="checkout-form">
            <div class="form-group">
              <label for="fullName">Full Name</label>
              <input type="text" id="fullName" name="fullName" placeholder="e.g., Juan Dela Cruz" required />
            </div>
            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" placeholder="student@dorsu.edu.ph" required />
            </div>
            <div class="form-group">
              <label for="address">Shipping Address</label>
              <input type="text" id="address" name="address" placeholder="Mati, Davao Oriental" required />
            </div>
            <button type="submit" class="btn btn-checkout">Complete Order</button>
          </form>
        </div>
      </div>

      <div class="card-box margin-top">
        <h2>Order History</h2>
        <div class="order-history-container"></div>
      </div>

    </aside>

  </main>

  <script type="module" src="js/controller.js"></script>
</body>
</html>
